# Run the game windowed
gfx.windowed=true

# Rotate the dual screens to vertical (portrait) orientation
gfx.rotate=true

# Disable raw developer debug keyboard bindings (F1-F10, NumPad, cheats)
input.disable_debug_keys=true

# Cabinet lighting options
# Normalize 110 cabinet LEDs into 4 zones (Screen, Front, Side L/R) for config.exe
light.normalized=true

# Stream raw 110-LED RGB lighting frames to serial port for DIY LED hardware
light.raw_serial=false
light.raw_serial_port=COM3
light.raw_serial_baud=115200

# Cabinet girlfriend hardware jumper simulation (PCSub)
# Designates default girlfriend for guest play / title attract (manaka, rinko, nene)
cabinet.girl=rinko

# Starting credits on boot (0 for authentic arcade mode waiting for medals, 1000 for dev free-play)
game.boot_credits=0

# Idle attract mode (alt = BOTH ALT: alternates Slot and Girlfriend Panel demo, panel = BOTH PANEL, slot = BOTH SLOT)
game.attract_mode=alt

# Unlock and display SECRET MODE directly in arcade TEST MODE menu
game.show_secret_menu=true

# Idle timeout in seconds before transitioning to Title/Attract CM (default: 30, arcade original: 120)
game.attract_timeout=30

# Boot directly into Title / Attract movie on game launch (default: true)
game.boot_to_title=true

# Auto-transfer inserted 100-yen coins to medals without pressing Transfer button (default: false)
coin.auto_transfer=false

# Play character opening WMV attract movie during Title sequence (default: true)
# If set to false, Title screen transitions smoothly directly to Slot Mode without playing video
game.play_movie=true


