# Windowed mode (true/false)
gfx.windowed=true

# Rotate dual screens to vertical orientation
gfx.rotate=true

# Disable developer debug hotkeys
input.disable_debug_keys=true

# Cabinet illumination serial pass-through
# light.port=COM3
# light.baud=115200

# Physical card reader serial port (leave commented for virtual reader)
# card.port=COM3

# Default cabinet girlfriend (manaka, rinko, nene)
cabinet.girl=rinko

# Show SECRET MODE in arcade Test Menu
game.show_secret_menu=true

# Attract idle timeout in seconds
game.attract_timeout=30

# Boot directly to title movie
game.boot_to_title=true

# Play opening character movie in title loop
game.play_movie=true
