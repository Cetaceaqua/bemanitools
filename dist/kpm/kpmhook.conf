# Enable windowed mode
gfx.windowed=true

# Rotate the sub screen to vertical orientation
gfx.rotate=true

# Enable the sub screen (set to false for single-monitor setup)
gfx.sub_screen=true

# Disable KONAMI debug hotkeys
input.disable_debug_keys=true

# Map sub screen touch to sensors
input.sub_screen_touch=true

# Cabinet light serial port pass-through (leave commented to disable)
# light.port=COM3
# light.baud=115200

# Physical card reader serial port (leave commented for virtual reader)
# card.port=COM3

# Default cabinet type (manaka, rinko, nene)
cabinet.girl=manaka

# Show SECRET MODE in the test menu
game.show_secret_menu=true

# Attract mode timeout in seconds
game.attract_timeout=30

# Boot directly into the title loop
game.boot_to_title=true

# Play demo movie during the title loop
game.play_movie=true
